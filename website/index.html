<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laptop Price Predictor</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <h1>Laptop Price Predictor</h1>
    <form id="predict-form">
      <label>Brand
        <input type="text" name="brand" placeholder="e.g. Dell">
      </label>
      <label>Model Year
        <input type="number" name="year" value="2022" min="2005" max="2025">
      </label>
      <label>RAM (GB)
        <input type="number" name="ram" value="8" min="0">
      </label>
      <label>Storage (GB)
        <input type="number" name="storage" value="256" min="0">
      </label>
      <label>Has SSD
        <select name="ssd">
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </label>
      <label>CPU
        <input type="text" name="cpu" placeholder="e.g. i5-8250U">
      </label>
      <button type="submit">Predict price</button>
    </form>

    <section id="result" class="result">
      <p>No prediction yet.</p>
    </section>

    <p class="note">This page posts to <code>/predict</code>. Run the included backend (optional) or wire your own API.</p>
  </main>

  <script src="/static/predict.js"></script>
</body>
</html>
